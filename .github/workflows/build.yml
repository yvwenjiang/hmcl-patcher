name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (with ProGuard obfuscation)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload obfuscated jar
        uses: actions/upload-artifact@v4
        with:
          name: hmcl-patcher
          path: build/libs/hmcl-patcher.jar

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/hmcl-patcher.jar \
            --title "${GITHUB_REF_NAME}" \
            --notes "hmcl-patcher ${GITHUB_REF_NAME}（已混淆的独立 jar，运行需要 JRE 17+）"
